---
apiVersion: v1
kind: Service
metadata:
  annotations:
    app.quarkus.io/quarkus-version: 3.24.4
    app.quarkus.io/vcs-uri: https://github.com/CCH0124/istio-with-quarkus.git
  labels:
    app.kubernetes.io/name: order
    version: v0.0.1
    sidecar.istio.io/inject: "true"
    app.kubernetes.io/managed-by: quarkus
  name: order
  namespace: default
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/name: order
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    app.quarkus.io/quarkus-version: 3.24.4
    app.quarkus.io/vcs-uri: https://github.com/CCH0124/istio-with-quarkus.git
  labels:
    app.kubernetes.io/name: order
    version: v0.0.1
    sidecar.istio.io/inject: "true"
    app.kubernetes.io/managed-by: quarkus
  name: order
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order
  template:
    metadata:
      annotations:
        app.quarkus.io/quarkus-version: 3.24.4
        app.quarkus.io/vcs-uri: https://github.com/CCH0124/istio-with-quarkus.git
      labels:
        version: v0.0.1
        sidecar.istio.io/inject: "true"
        app.kubernetes.io/managed-by: quarkus
        app.kubernetes.io/name: order
    spec:
      containers:
        - env:
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: QUARKUS_REST_CLIENT_PRODUCT_SERVICE_CLIENT_URL
              value: http://istio-lab.cch.com:9080
            - name: QUARKUS_APPLICATION_VERSION
              value: v0.0.1
          image: registry.hub.docker.com/cch0124/order:v0.0.1
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /q/health/live
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
          name: order
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /q/health/ready
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 64Mi
          startupProbe:
            failureThreshold: 3
            httpGet:
              path: /q/health/started
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
      hostAliases:
        - hostnames:
            - istio-lab.cch.com
          ip: 192.168.153.132
