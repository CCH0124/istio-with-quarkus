---
apiVersion: v1
kind: Service
metadata:
  annotations:
    app.quarkus.io/quarkus-version: 3.24.4
  labels:
    app.kubernetes.io/name: istio-helloworld
    version: v0.0.1
    sidecar.istio.io/inject: "true"
    app.kubernetes.io/managed-by: quarkus
  name: istio-helloworld
  namespace: default
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/name: istio-helloworld
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    app.quarkus.io/quarkus-version: 3.24.4
  labels:
    app.kubernetes.io/name: istio-helloworld
    version: v0.0.1
    sidecar.istio.io/inject: "true"
    app.kubernetes.io/managed-by: quarkus
  name: istio-helloworld
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: istio-helloworld
  template:
    metadata:
      annotations:
        app.quarkus.io/quarkus-version: 3.24.4
      labels:
        version: v0.0.1
        sidecar.istio.io/inject: "true"
        app.kubernetes.io/managed-by: quarkus
        app.kubernetes.io/name: istio-helloworld
    spec:
      containers:
        - env:
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: QUARKUS_APPLICATION_VERSION
              value: v0.0.1
          image: registry.hub.docker.com/cch0124/istio-helloworld:v0.0.1
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /q/health/live
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
          name: istio-helloworld
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /q/health/ready
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 10Mi
          startupProbe:
            failureThreshold: 3
            httpGet:
              path: /q/health/started
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
